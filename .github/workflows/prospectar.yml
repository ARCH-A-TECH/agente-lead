name: Prospectar leads

on:
  schedule:
    # Segunda a sexta, 08:23 no horário do Tocantins (11:23 UTC).
    - cron: "23 11 * * 1-5"
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos leads buscar agora (vazio = valor do config.toml)"
        required: false
        default: ""
      teste:
        description: "Só mostrar os leads no log, sem gravar na planilha"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prospectar
  cancel-in-progress: false

jobs:
  prospectar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar o agente
        env:
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE: ${{ inputs.limite }}
          TESTE: ${{ inputs.teste }}
        run: |
          args=()
          if [[ "$LIMITE" =~ ^[0-9]+$ ]]; then args+=(--limite "$LIMITE"); fi
          if [[ "$TESTE" == "true" ]]; then args+=(--teste); fi
          python -m agente_lead "${args[@]}"
